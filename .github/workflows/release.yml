name: Release build
run-name: Build ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing geminus version tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release tag
        id: source
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch --depth=1 --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then test "$commit" = "$(git rev-parse HEAD)"; fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build and checksum release binaries
        run: |
          mkdir "$RUNNER_TEMP/programs" "$RUNNER_TEMP/assets"
          go run ./scripts/release-build "${TAG#v}" "$RUNNER_TEMP/programs"
          cd "$RUNNER_TEMP/assets"
          for file in "$RUNNER_TEMP"/programs/*; do
            name="geminus-${file##*/}"
            if [[ "$name" == geminus-windows-* ]]; then name+=.exe; fi
            mv "$file" "$name"
          done
          sha256sum geminus-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geminus-${{ env.TAG }}-${{ steps.source.outputs.commit }}
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
